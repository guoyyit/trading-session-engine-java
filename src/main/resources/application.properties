spring.application.name=trading-session-engine

# Static price band half-width as a fraction of the daily reference price.
trading.price-band.static-percentage=0.10
# Dynamic price band half-width as a fraction of the latest quote price.
trading.price-band.dynamic-percentage=0.03

# Disposition strategies while an instrument is halted: ACCEPT | REJECT | QUEUE
trading.halt.resting-strategy=REJECT
trading.halt.incoming-order-strategy=REJECT
trading.halt.incoming-cancel-strategy=ACCEPT

# Durable append-only audit/event log used for recovery and replay.
trading.event-log=./data/trading-events.log
